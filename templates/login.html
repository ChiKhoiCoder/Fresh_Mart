{% extends "base.html" %}

{% block title %}Đăng Nhập — {{ store_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-100 shadow-xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-fresh-600 flex items-center justify-center text-white text-2xl mx-auto mb-3 shadow-md">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900">Đăng Nhập FreshMart</h1>
            <p class="text-xs text-slate-500 mt-1">Đăng nhập để theo dõi đơn hàng và nhận ưu đãi riêng</p>
        </div>

        <!-- Nút điền nhanh tài khoản demo để chấm điểm đồ án -->
        <div class="mb-6 p-3 bg-amber-50 border border-amber-200 rounded-2xl">
            <span class="text-[11px] font-bold text-amber-900 block mb-1.5 flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i>
                <span>Tài khoản mẫu thử nghiệm (Click để điền nhanh):</span>
            </span>
            <div class="flex gap-2">
                <button type="button" onclick="fillDemoAccount('admin', 'admin123')" 
                        class="flex-1 bg-white hover:bg-amber-100 text-amber-950 font-bold text-[11px] py-1.5 px-2 rounded-xl border border-amber-300 shadow-2xs transition-colors">
                    <i class="fa-solid fa-user-shield mr-1"></i> Admin
                </button>
                <button type="button" onclick="fillDemoAccount('khachhang', '123456')" 
                        class="flex-1 bg-white hover:bg-amber-100 text-amber-950 font-bold text-[11px] py-1.5 px-2 rounded-xl border border-amber-300 shadow-2xs transition-colors">
                    <i class="fa-solid fa-user mr-1"></i> Khách hàng
                </button>
            </div>
        </div>

        <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="font-bold text-slate-700 block mb-1.5">Tên đăng nhập hoặc Email</label>
                <div class="relative">
                    <input type="text" name="identifier" required placeholder="admin hoặc khachhang"
                           class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600 text-xs">
                    <i class="fa-regular fa-user absolute left-3 top-3 text-slate-400"></i>
                </div>
            </div>

            <div>
                <label class="font-bold text-slate-700 block mb-1.5">Mật khẩu</label>
                <div class="relative">
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600 text-xs">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400"></i>
                </div>
            </div>

            <button type="submit" class="w-full bg-fresh-600 hover:bg-fresh-700 text-white font-black py-3 rounded-xl transition-all shadow-md text-sm">
                Đăng Nhập
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <span>Chưa có tài khoản? </span>
            <a href="{{ url_for('register') }}" class="font-bold text-fresh-600 hover:text-fresh-700 hover:underline">
                Đăng ký ngay tại đây
            </a>
        </div>
    </div>
</div>
{% endblock %}
