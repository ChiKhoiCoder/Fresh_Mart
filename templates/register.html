{% extends "base.html" %}

{% block title %}Đăng Ký Tài Khoản — {{ store_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-100 shadow-xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-fresh-600 flex items-center justify-center text-white text-2xl mx-auto mb-3 shadow-md">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900">Tạo Tài Khoản Mới</h1>
            <p class="text-xs text-slate-500 mt-1">Gia nhập cộng đồng người tiêu dùng thông thái cùng FreshMart</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-3.5 text-xs">
            <div>
                <label class="font-bold text-slate-700 block mb-1">Họ và tên đầy đủ <span class="text-rose-500">*</span></label>
                <input type="text" name="fullname" required placeholder="Nguyễn Văn An"
                       class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600">
            </div>

            <div>
                <label class="font-bold text-slate-700 block mb-1">Tên đăng nhập <span class="text-rose-500">*</span></label>
                <input type="text" name="username" required placeholder="nguyenan99"
                       class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600">
            </div>

            <div>
                <label class="font-bold text-slate-700 block mb-1">Địa chỉ Email <span class="text-rose-500">*</span></label>
                <input type="email" name="email" required placeholder="an.nguyen@gmail.com"
                       class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="font-bold text-slate-700 block mb-1">Số điện thoại</label>
                    <input type="tel" name="phone" placeholder="0912345678"
                           class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600">
                </div>
                <div>
                    <label class="font-bold text-slate-700 block mb-1">Địa chỉ nhận hàng</label>
                    <input type="text" name="address" placeholder="Cầu Giấy, Hà Nội"
                           class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="font-bold text-slate-700 block mb-1">Mật khẩu <span class="text-rose-500">*</span></label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600">
                </div>
                <div>
                    <label class="font-bold text-slate-700 block mb-1">Xác nhận MK <span class="text-rose-500">*</span></label>
                    <input type="password" name="confirm_password" required placeholder="••••••••"
                           class="w-full p-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-fresh-600">
                </div>
            </div>

            <button type="submit" class="w-full mt-2 bg-fresh-600 hover:bg-fresh-700 text-white font-black py-3 rounded-xl transition-all shadow-md text-sm">
                Đăng Ký Tài Khoản
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <span>Đã có tài khoản? </span>
            <a href="{{ url_for('login') }}" class="font-bold text-fresh-600 hover:text-fresh-700 hover:underline">
                Đăng nhập tại đây
            </a>
        </div>
    </div>
</div>
{% endblock %}
